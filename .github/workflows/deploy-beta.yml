# .github/workflows/deploy-beta.yml
#
# 베타 서버(OCI, dev-api.gopssl.com, DB = OCI 내부 Docker Postgres 17, 127.0.0.1:5432) 자동 배포
# - dev 에 push(머지)되면 dev 를 배포
# - Actions 탭 → "Deploy to Beta (OCI)" → "Run workflow" 에서 브랜치를 골라 배포
#
# 필요한 Secret: OCI_SSH_HOST, OCI_SSH_USER, OCI_SSH_KEY
# 서버의 .env(untracked)는 git checkout -B / reset 으로 바뀌지 않는다.
# systemd 서비스: gopssl-beta, 포트: 8000, venv: ~/Gopssl-Backend/venv (Python 3.12)

name: Deploy to Beta (OCI)

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      branch:
        description: "베타에 배포할 브랜치"
        required: true
        default: dev
        type: string

# 동시 실행 방지: 진행 중인 배포는 취소하지 않고, 다음 실행은 끝날 때까지 대기
concurrency:
  group: deploy-beta
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: Gopssl-Backend # 서버 사용자 홈 디렉터리 기준
  SERVICE_NAME: gopssl-beta
  APP_PORT: "8000"
  HEALTH_TIMEOUT_SECONDS: "30"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. 배포할 브랜치 결정 + 검증 (서버 접속 전)
      #    dispatch input 은 셸 코드에 직접 넣지 않고 env 로만 넘긴다 (명령 주입 방지)
      - name: Resolve branch
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BRANCH: ${{ inputs.branch }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            BRANCH="$INPUT_BRANCH"
          else
            BRANCH="dev"
          fi

          # 브랜치 이름 형식 검사: 영문/숫자/._-/ 만 허용, git ref 규칙 준수
          if ! printf '%s' "$BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$' \
             || ! git check-ref-format --branch "$BRANCH" >/dev/null 2>&1; then
            echo "::error::허용되지 않는 브랜치 이름입니다."
            exit 1
          fi

          # 원격에 실제로 있는 브랜치인지 확인
          COMMIT="$(git ls-remote --heads "$REPO_URL" "refs/heads/$BRANCH" | cut -f1)"
          if [ -z "$COMMIT" ]; then
            echo "::error::원격에 브랜치가 없습니다: $BRANCH"
            exit 1
          fi

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "배포 대상: $BRANCH ($COMMIT)"

      # 2. 베타 서버에서 코드 갱신 → 의존성 설치 → 재시작 → 로컬 헬스 체크
      #    venv/bin/pip 가 없으면 코드·서비스를 건드리기 전에 실패한다.
      #    헬스 체크는 /docs (앱에 / 와 /health 라우트가 없음). DB 연결은 확인하지 않는다.
      - name: SSH into Beta and Deploy
        id: deploy
        uses: appleboy/ssh-action@master
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: 22
          envs: BRANCH,APP_DIR,SERVICE_NAME,APP_PORT,HEALTH_TIMEOUT_SECONDS
          capture_stdout: true
          script: |
            set -eu
            cd "$HOME/$APP_DIR"
            if [ ! -x venv/bin/pip ]; then
              echo "venv/bin/pip 가 없습니다: $HOME/$APP_DIR/venv (재시작하지 않고 중단)"
              exit 1
            fi
            git fetch origin
            git checkout -B "$BRANCH" "origin/$BRANCH"
            venv/bin/pip install -r requirements.txt
            sudo -n systemctl restart "$SERVICE_NAME"

            HEALTH_URL="http://127.0.0.1:$APP_PORT/docs"
            deadline=$(( $(date +%s) + HEALTH_TIMEOUT_SECONDS ))
            until curl -fsS -o /dev/null --max-time 5 "$HEALTH_URL"; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "헬스 체크 실패: ${HEALTH_TIMEOUT_SECONDS}초 안에 $HEALTH_URL 응답 없음"
                sudo -n systemctl status "$SERVICE_NAME" --no-pager || true
                exit 1
              fi
              echo "헬스 체크 대기 중... ($HEALTH_URL)"
              sleep 3
            done
            echo "헬스 체크 성공 ($HEALTH_URL)"
            echo "DEPLOYED_COMMIT=$(git rev-parse HEAD)"

      # 3. 배포 결과 출력
      - name: Deployment summary
        if: always() && steps.target.outputs.branch != ''
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          EXPECTED_COMMIT: ${{ steps.target.outputs.commit }}
          SSH_STDOUT: ${{ steps.deploy.outputs.stdout }}
        run: |
          DEPLOYED_COMMIT="$(printf '%s\n' "$SSH_STDOUT" | sed -n 's/^DEPLOYED_COMMIT=//p' | tail -1)"
          echo "브랜치: $BRANCH"
          echo "요청 시점 원격 커밋: $EXPECTED_COMMIT"
          echo "서버 배포 커밋: ${DEPLOYED_COMMIT:-(확인 불가)}"
          {
            echo "### 베타 배포 (OCI)"
            echo "- 브랜치: \`$BRANCH\`"
            echo "- 요청 시점 원격 커밋: \`$EXPECTED_COMMIT\`"
            echo "- 서버 배포 커밋: \`${DEPLOYED_COMMIT:-확인 불가}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DEPLOYED_COMMIT" ] && [ "$DEPLOYED_COMMIT" != "$EXPECTED_COMMIT" ]; then
            echo "::warning::요청 이후 브랜치에 새 커밋이 push 되어 서버 커밋이 다릅니다."
          fi
